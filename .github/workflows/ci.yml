name: Checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  # Let active checks finish when another push or rerun is queued.
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble bundled Python runtime
        run: python scripts/bundle_runtime.py
      - name: Build and test C++ engine
        run: ./scripts/build_cpp_engine.ps1
      - name: Verify detached app resources
        run: python scripts/verify_bundled_runtime.py
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target
      - run: npm ci
        working-directory: rust
      - run: npm test
        working-directory: rust
      - run: npm run build
        working-directory: rust
      - name: Test with bundled Python and packages
        run: >-
          rust/src-tauri/bin/python/python.exe -B -c
          "import runpy, sys; sys.path.insert(0, '.'); sys.argv = ['unittest', 'discover', '-s', 'PyEngine/tests', '-v']; runpy.run_module('unittest', run_name='__main__')"
      - run: cargo test --locked --manifest-path rust/src-tauri/Cargo.toml
