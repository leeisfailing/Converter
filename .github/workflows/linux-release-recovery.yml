name: Linux Release Recovery
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original Linux Release run containing the successful signed package
        required: true
        type: string
      tag:
        description: Existing immutable Linux release tag matching the current app version
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.source.outputs.artifact-id }}
      tag-commit: ${{ steps.source.outputs.tag-commit }}
      source-sha: ${{ github.sha }}
    steps:
      - name: Require trusted main workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/package-lock.json
      - name: Test current publisher and release validators
        working-directory: rust
        run: |
          npm ci --include=optional
          npm test -- scripts
      - name: Verify signed package provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.run_id }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: node rust/scripts/validate-linux-recovery.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-assets
      - name: Verify signed native artifact with current Linux public key
        run: node rust/scripts/generate-update-manifest.mjs release-assets --linux-only
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-assets
      - name: Reverify signed artifact and regenerate immutable manifest
        run: node rust/scripts/generate-update-manifest.mjs release-assets --linux-only
      - name: Recover publication with current fixed publisher
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.tag-commit }}
        run: node rust/scripts/publish-release.mjs release-assets --linux-only
