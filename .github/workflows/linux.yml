name: Linux
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
permissions:
  contents: read
concurrency:
  group: linux-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf ffmpeg libfuse2t64 libcrypt1
      - run: npm ci --include=optional
        working-directory: rust
      - run: npm run setup:linux
        working-directory: rust
      - run: ctest --test-dir cpp_engine/build-linux --output-on-failure
      - run: python3 scripts/verify_linux_runtime.py
      - run: rust/src-tauri/bin/linux/python/bin/python3 -B -m unittest discover -s PyEngine/tests -v
      - run: npm run release:check -- --linux-only
        working-directory: rust
      - run: npm test
        working-directory: rust
      - run: npm run build
        working-directory: rust
      - run: cargo test --locked --manifest-path rust/src-tauri/Cargo.toml
      - name: Build unsigned AppImage for packaging smoke test
        if: ${{ !inputs.release }}
        working-directory: rust
        env:
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run build:linux -- --unsigned -- --locked
      - name: Verify extracted unsigned AppImage media runtime
        if: ${{ !inputs.release }}
        run: node rust/scripts/verify-appimage.mjs rust/src-tauri/target/release/bundle/appimage
      - name: Upload unsigned test AppImage
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage-smoke
          path: rust/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  package:
    if: inputs.release
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: linux-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf ffmpeg libfuse2t64 libcrypt1
      - run: npm ci --include=optional
        working-directory: rust
      - run: npm run setup:linux
        working-directory: rust
      - run: python3 scripts/verify_linux_runtime.py
      - name: Build signed Linux release
        working-directory: rust
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY in the linux-release environment.'; exit 1; }
          npm run build:linux -- -- --locked
      - name: Verify extracted AppImage runtime
        run: node rust/scripts/verify-appimage.mjs rust/src-tauri/target/release/bundle/appimage
      - name: Collect release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: |
            rust/src-tauri/target/release/bundle/appimage/*.AppImage
            rust/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
