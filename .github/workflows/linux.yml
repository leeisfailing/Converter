name: Linux checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: linux-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust/src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf ffmpeg
      - run: npm ci --include=optional
        working-directory: rust
      - run: npm run setup:linux
        working-directory: rust
      - run: ctest --test-dir cpp_engine/build-linux --output-on-failure
      - run: python3 scripts/verify_linux_runtime.py
      - run: rust/src-tauri/bin/linux/python/bin/python3 -B -m unittest discover -s PyEngine/tests -v
      - run: npm test
        working-directory: rust
      - run: npm run build
        working-directory: rust
      - run: cargo test --locked --manifest-path rust/src-tauri/Cargo.toml
      - name: Build Linux application
        run: npm run build:linux -- -- --locked
        working-directory: rust
