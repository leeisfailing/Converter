[package]
name = "converter"
version = "3.0.0"
description = "Media Downloader"
authors = ["Lee"]
edition = "2021"

[lib]
name = "converter_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "process", "sync"] }
dirs = "5"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
